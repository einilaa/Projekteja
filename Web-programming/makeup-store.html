<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" type="text/css">
    <script src="script.js" defer></script>
    <title>Document</title>
</head>

<body>
    <h1 class="gradient-title">Makeup Store</h1>

    <div class="allproducts">

        <div class="product">
            <img src="images/lipgloss.jpg" alt="lipgloss">
            <h3>Lipgloss</h3>
            <p data-price="2.90">2.90€</p>
            <button class="add-to-cart">Add to cart</button>
        </div>

        <div class="product">
            <img src="images/lipstick.jpg" alt="lipstick">
            <h3>Lipstick</h3>
            <p data-price="4.99">4.99€</p>
            <button class="add-to-cart">Add to cart</button>
        </div>

        <div class="product">
            <img src="images/eyeshadow.jpg" alt="eyeshadow">
            <h3>Eyeshadow</h3>
            <p data-price="3.50">3.50€</p>
            <button class="add-to-cart">Add to cart</button>
        </div>

        <div class="product">
            <img src="images/mascara.jpg" alt="mascara">
            <h3>Mascara</h3>
            <p data-price="7.99">7.99€</p>
            <button class="add-to-cart">Add to cart</button>
        </div>

        <div class="product">
            <img src="images/nailpolish.jpg" alt="nailpolish">
            <h3>Nailpolish</h3>
            <p data-price="2.50">2.50€</p>
            <button class="add-to-cart">Add to cart</button>
        </div>

        <div class="product">
            <img src="images/bodybutter.jpg" alt="bodybutter">
            <h3>Bodybutter</h3>
            <p data-price="6.50">6.50€</p>
            <button class="add-to-cart">Add to cart</button>
        </div>

        <div class="product">
            <img src="images/bodymist.jpg" alt="bodymist">
            <h3>Bodymist</h3>
            <p data-price="7.50">7.50€</p>
            <button class="add-to-cart">Add to cart</button>
        </div>

    </div>

    <div id="cart">
        <h3>Shopping Cart</h3>
        <ul id="cart-items"></ul>
        <p>Total: <span id="total">0.00€</span></p>
    </div>

</body>

</html>
